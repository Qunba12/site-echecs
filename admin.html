<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Admin - Le Cercle des Rois</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .admin-box { background: #f4f4f9; padding: 20px; border-radius: 8px; max-width: 400px; }
        input { display: block; width: 90%; margin-bottom: 10px; padding: 8px; }
        button { background: #2c3e50; color: white; padding: 10px 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>Ajouter un Joueur</h2>
        <form id="add-player-form">
            <label>Nom du joueur :</label>
            <input type="text" id="nom" placeholder="Ex: Lucas" required>

            <label>Titre :</label>
            <input type="text" id="titre" placeholder="Ex: Maître, Novice..." required>

            <label>Elo Club :</label>
            <input type="number" id="elo" placeholder="Ex: 1645" required>

            <button type="submit">Ajouter à la base de données</button>
        </form>
        <p id="message-succes" style="color: green; display: none;">Joueur ajouté avec succès !</p>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
